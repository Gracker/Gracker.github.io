<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC, sans-serif" fill="#172631"><text x="80" y="75" text-anchor="start" font-size="30" fill="#172631">TraceDemo · 分轮结果与最终交付</text><text x="80" y="125" text-anchor="start" font-size="25" fill="#596776">不同修订、不同样本；完成数不是诊断准确率。</text><rect x="80" y="190" width="280" height="100" rx="5" fill="white" stroke="#82909d" stroke-width="3.5"/><text x="220.0" y="249.8" text-anchor="middle" font-size="28" fill="#172631">fixround88</text><text x="410" y="247" text-anchor="start" font-size="35" fill="#172631">88</text><text x="640" y="247" text-anchor="start" font-size="25" fill="#172631">合成样本完成；用于发现过程问题</text><rect x="80" y="323" width="280" height="100" rx="5" fill="white" stroke="#82909d" stroke-width="3.5"/><text x="220.0" y="382.8" text-anchor="middle" font-size="28" fill="#172631">P1–P5</text><text x="410" y="380" text-anchor="start" font-size="35" fill="#172631">9 / 9</text><text x="640" y="380" text-anchor="start" font-size="25" fill="#172631">定向复测；仍有 15 次自由 SQL 失败后恢复</text><rect x="80" y="456" width="280" height="100" rx="5" fill="white" stroke="#82909d" stroke-width="3.5"/><text x="220.0" y="515.8" text-anchor="middle" font-size="28" fill="#172631">unseen30</text><text x="410" y="513" text-anchor="start" font-size="35" fill="#172631">29 + 1</text><text x="640" y="513" text-anchor="start" font-size="25" fill="#172631">原始成功 / 失败；后续 27 原始 + 3 隔离回放</text><rect x="80" y="589" width="280" height="100" rx="5" fill="white" stroke="#82909d" stroke-width="3.5"/><text x="220.0" y="648.8" text-anchor="middle" font-size="28" fill="#172631">fresh50</text><text x="410" y="646" text-anchor="start" font-size="35" fill="#172631">49 + 1</text><text x="640" y="646" text-anchor="start" font-size="25" fill="#172631">批量 + 独立 smoke；发生在 F1–F6 修复前</text><text x="80" y="780" text-anchor="start" font-size="29" fill="#172631">1.19.0 最终门禁</text><rect x="80" y="820" width="430" height="115" rx="5" fill="white" stroke="#4A90D9" stroke-width="3.5"/><text x="295.0" y="865.9" text-anchor="middle" font-size="24" fill="#172631">405 项期望 · 2013 项 SQL 合同</text><text x="295.0" y="905.9" text-anchor="middle" font-size="24" fill="#172631">6 / 6 场景 trace</text><rect x="570" y="820" width="430" height="115" rx="5" fill="white" stroke="#4CAF50" stroke-width="3.5"/><text x="785.0" y="865.9" text-anchor="middle" font-size="24" fill="#172631">Windows · macOS · Linux</text><text x="785.0" y="905.9" text-anchor="middle" font-size="24" fill="#172631">最终归档原生 smoke 通过</text><rect x="1060" y="820" width="460" height="115" rx="5" fill="white" stroke="#4CAF50" stroke-width="3.5"/><text x="1290.0" y="865.9" text-anchor="middle" font-size="24" fill="#172631">npm 安装 · Docker 双架构</text><text x="1290.0" y="905.9" text-anchor="middle" font-size="24" fill="#172631">分别完成交付验收</text><text x="80" y="1005" text-anchor="start" font-size="24" fill="#596776">修复后未全量重跑 fresh50；SQL 合同执行不等于真实模型案例或全部语义证明。</text></g></svg>