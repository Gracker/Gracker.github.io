<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940"><rect width="100%" height="100%" fill="white"/><g font-family="PingFang SC, sans-serif" fill="#172631"><text x="80" y="75" text-anchor="start" font-size="30" fill="#172631">两种独立的使用路径</text><rect x="80" y="145" width="610" height="105" rx="5" fill="white" stroke="#4A90D9" stroke-width="3.5"/><text x="385.0" y="208.7" text-anchor="middle" font-size="32" fill="#172631">SmartPerfetto</text><rect x="810" y="145" width="610" height="105" rx="5" fill="white" stroke="#4CAF50" stroke-width="3.5"/><text x="1115.0" y="208.7" text-anchor="middle" font-size="32" fill="#172631">Perfetto-Skills</text><path d="M385,250 L385,300" fill="none" stroke="#172631" stroke-width="3"/><path d="M378,289 L385,300 L392,289" fill="none" stroke="#172631" stroke-width="3"/><path d="M1115,250 L1115,300" fill="none" stroke="#172631" stroke-width="3"/><path d="M1108,289 L1115,300 L1122,289" fill="none" stroke="#172631" stroke-width="3"/><rect x="80" y="300" width="610" height="210" rx="5" fill="white" stroke="#4A90D9" stroke-width="3.5"/><text x="385.0" y="372.1" text-anchor="middle" font-size="26" fill="#172631">Web / CLI / API</text><text x="385.0" y="414.1" text-anchor="middle" font-size="26" fill="#172631">会话 · 比较 · 报告</text><text x="385.0" y="456.1" text-anchor="middle" font-size="26" fill="#172631">产品管理 Provider 与分析流程</text><rect x="810" y="300" width="610" height="210" rx="5" fill="white" stroke="#4CAF50" stroke-width="3.5"/><text x="1115.0" y="372.1" text-anchor="middle" font-size="26" fill="#172631">Codex / Claude Code / OpenCode</text><text x="1115.0" y="414.1" text-anchor="middle" font-size="26" fill="#172631">本地 Skill + 确定性 runner</text><text x="1115.0" y="456.1" text-anchor="middle" font-size="26" fill="#172631">Agent 管理模型与文件访问</text><path d="M385,510 L385,560" fill="none" stroke="#172631" stroke-width="3"/><path d="M378,549 L385,560 L392,549" fill="none" stroke="#172631" stroke-width="3"/><path d="M1115,510 L1115,560" fill="none" stroke="#172631" stroke-width="3"/><path d="M1108,549 L1115,560 L1122,549" fill="none" stroke="#172631" stroke-width="3"/><rect x="80" y="560" width="610" height="110" rx="5" fill="white" stroke="#4A90D9" stroke-width="3.5"/><text x="385.0" y="624.8" text-anchor="middle" font-size="28" fill="#172631">完整的 trace 分析产品</text><rect x="810" y="560" width="610" height="110" rx="5" fill="white" stroke="#4CAF50" stroke-width="3.5"/><text x="1115.0" y="624.1" text-anchor="middle" font-size="26" fill="#172631">在现有 Agent 中分析 trace</text><text x="80" y="750" text-anchor="start" font-size="24" fill="#172631">公开 SQL / 方法通过固定提交同步，独立运行与测试。</text><text x="80" y="790" text-anchor="start" font-size="24" fill="#172631">Perfetto-Skills 无需 SmartPerfetto 服务，也不是 Google 官方 Perfetto Skill。</text><text x="80" y="830" text-anchor="start" font-size="24" fill="#172631">数据是否发送给模型，由所用产品 / Agent 的权限与 Provider 策略决定。</text></g></svg>